[project]
name = "pr-evidence-reviewer"
version = "0.1.0.dev0"
description = "Checks the claims in a GitHub PR description against the diff, source, tests, and CI at the PR's head commit."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Sandy Thomas" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.9,<3",
    "httpx>=0.28,<1",
]

[project.scripts]
prev = "pr_evidence_reviewer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_evidence_reviewer"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["pr_evidence_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
